  <!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOMBERE'</title><style>
:root{--n:#071a3b;--g:#138a67;--b:#0d3972;--bg:#f4f7fb;--line:#dfe6ef;--muted:#687386}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#172033}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071a3b,#0d3972 58%,#138a67)}.loginbox{width:440px;background:white;border-radius:24px;padding:34px;box-shadow:0 25px 70px #00142d66}.logos{display:flex;justify-content:space-between;align-items:center}.logos img{max-width:145px;max-height:48px;object-fit:contain}.sombere{font-size:36px;font-weight:900;font-style:italic;color:var(--n);margin:28px 0 4px}.sub{font-size:12px;color:var(--muted);margin-bottom:25px}.field{margin:12px 0}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:white}.field textarea{min-height:76px}.btn{width:100%;padding:13px;border:0;border-radius:11px;color:white;background:linear-gradient(90deg,var(--b),var(--g));font-weight:800;cursor:pointer}.err{color:#b42318;font-size:12px;margin:10px 0}.app{display:none}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 24px}.top img{max-height:43px;max-width:145px}.shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 76px)}aside{background:var(--n);color:#fff;padding:20px 13px}.user{background:linear-gradient(135deg,#0c4380,#138a67);padding:15px;border-radius:15px;margin-bottom:20px}.nav button{width:100%;border:0;background:transparent;color:#dce7f5;text-align:left;padding:12px;border-radius:10px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff1c}.navybrand{font-size:25px;font-weight:900;font-style:italic}main{padding:26px}.hero{padding:25px;border-radius:21px;background:linear-gradient(120deg,#e9f3ff,#fff 55%,#e9f8f2)}h1,h2,h3{color:var(--n)}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,1fr);margin:17px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.num{font-size:28px;font-weight:900;color:var(--n)}.muted{color:var(--muted);font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.action{border:0;border-radius:10px;padding:11px 14px;background:linear-gradient(90deg,var(--b),var(--g));color:white;font-weight:800;cursor:pointer}.secondary{background:white;color:var(--n);border:1px solid var(--line)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left}.badge{font-size:10px;font-weight:800;padding:5px 9px;border-radius:999px;background:#e8f7f1;color:#087252}.warn{background:#fff0d5;color:#9b6300}.formgrid{grid-template-columns:1fr 1fr}.notice{background:#edf5ff;color:#173d70;padding:13px;border-radius:11px;font-size:12px;margin:12px 0}.hidden{display:none}@media(max-width:1000px){.shell{grid-template-columns:220px 1fr}.kpis,.formgrid{grid-template-columns:1fr 1fr}}
</style></head><body><section class="login" id="login"><div class="loginbox"><div class="logos"><img src="public/logo_bank.jpg"><img src="logo_syariah.jpg"></div><div class="sombere">SOMBERE’</div><div class="sub">Sistem Operasional Manajemen Buku Elektronik Register & Administrasi</div><div class="field"><label>Username</label><input id="username" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div id="err" class="err"></div><button class="btn" onclick="login()">MASUK</button></div></section><section class="app" id="app"><header class="top"><div class="row"><img src="public/logo_bank.jpg"><div class="navybrand">SOMBERE’</div></div><div class="row"><span id="who"></span><button class="action secondary" onclick="logout()">Keluar</button><img src="logo_syariah.jpg"></div></header><div class="shell"><aside><div class="user"><span class="muted" style="color:#d8e5f5">LOGIN SEBAGAI</span><br><b id="role"></b><br><small id="uname"></small></div><div class="nav" id="nav"></div><div style="margin:35px 10px;color:#9fb1c9"><b style="color:white">SOMBERE’</b><br><small>PT Bank Sulselbar<br>Melayani Sepenuh Hati</small></div></aside><main id="main"></main></div></section><script src="config.js"></script><script>
let token=localStorage.sombere_token||'',user=JSON.parse(localStorage.sombere_user||'null'),page='dashboard'; const api=window.SOMBERE_CONFIG.API_URL;
async function request(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};const r=await fetch(api+path,opt);const d=await r.json();if(!r.ok)throw Error(d.message||'Terjadi kesalahan');return d}
async function login(){try{document.querySelector('#err').textContent='';const d=await fetch(api+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.message);return d});token=d.token;user=d.user;localStorage.sombere_token=token;localStorage.sombere_user=JSON.stringify(user);showApp()}catch(e){document.querySelector('#err').textContent=e.message+' — pastikan server SOMBERE aktif.'}}
function logout(){localStorage.removeItem('sombere_token');localStorage.removeItem('sombere_user');location.reload()}
const menu=[['dashboard','⌂ Dashboard',['Master Administrator','Maker','Approver','Viewer']],['journal','▥ Register Jurnal',['Master Administrator','Maker','Viewer']],['kk','▣ Kartu Kontrol',['Master Administrator','Maker','Approver','Viewer']],['ope','▤ Kartu Kontrol OPE',['Master Administrator','Maker','Approver','Viewer']],['approval','✓ Approval',['Master Administrator','Approver']],['monitor','◫ Monitoring',['Master Administrator','Maker','Approver','Viewer']],['report','▥ Laporan',['Master Administrator','Maker','Approver','Viewer']],['admin','⚙ Administrasi',['Master Administrator']],['audit','◉ Audit Trail',['Master Administrator']]];
function showApp(){login.style.display='none';app.style.display='block';who.textContent=user.name;role.textContent=user.role;uname.textContent=user.username;renderNav();render()}
function renderNav(){nav.innerHTML=menu.filter(x=>x[2].includes(user.role)).map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){page=p;renderNav();render()}
async function render(){if(page==='dashboard')return dashboard();if(page==='journal')return journals();if(page==='kk')return controlCards();if(page==='approval')return approvals();main.innerHTML=`<div class="hero"><div class="muted">SOMBERE’ V6.2 MULTI-USER</div><h2>${menu.find(x=>x[0]===page)?.[1].replace(/^\S+ /,'')||page}</h2><p>Modul ini telah disiapkan pada struktur database dan akan diaktifkan pada tahap berikutnya setelah fondasi Login, Role, Dashboard dan Register Jurnal V5.4 divalidasi.</p></div>`}
async function dashboard(){try{const d=await request('/dashboard');main.innerHTML=`<div class="hero"><div class="muted">Selamat Datang, ${user.name}</div><h1>Dashboard SOMBERE’</h1><p>Sistem administrasi multi-user PT Bank Sulselbar.</p><span class="badge">Server Terhubung • ${user.role}</span></div><div class="grid kpis"><div class="card"><div class="muted">Total Register Jurnal</div><div class="num">${d.journals.total}</div></div><div class="card"><div class="muted">Register Aktif</div><div class="num">${d.journals.aktif}</div></div><div class="card"><div class="muted">Kartu Kontrol</div><div class="num">—</div></div><div class="card"><div class="muted">Menunggu Approval</div><div class="num">—</div></div></div><div class="notice">Register Jurnal V5.4 berdiri sendiri dan tidak terhubung dengan Kartu Kontrol, OPE atau Tagihan.</div>`}catch(e){main.innerHTML=`<div class="card"><h2>Server SOMBERE’ belum terhubung</h2><p>${e.message}</p><div class="notice">Hubungkan aplikasi desktop ke API Server internal melalui desktop/config.js.</div></div>`}}
async function journals(){try{const rows=await request('/journals');main.innerHTML=`<div class="row"><div><div class="muted">REGISTER JURNAL V5.4</div><h2>Register Jurnal Elektronik</h2></div>${['Master Administrator','Maker'].includes(user.role)?'<button class="action" onclick="journalForm()">+ Buat Register</button>':''}</div><div class="notice">Nomor jurnal otomatis: 0001/KP/IX/2026. Nomor yang sudah diterbitkan tidak pernah digunakan kembali. Register Jurnal tidak memiliki relasi ke Kartu Kontrol/Tagihan/OPE.</div><div class="card"><table><thead><tr><th>Nomor</th><th>Tanggal</th><th>Nama Biaya</th><th>Nominal</th><th>Penerima</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${x.journal_no}</b></td><td>${String(x.journal_date).slice(0,10)}</td><td>${x.cost_name}</td><td>${rupiah(x.amount)}</td><td>${x.payee}</td><td><span class="badge ${x.status==='BATAL'?'warn':''}">${x.status}</span></td><td>${x.status==='AKTIF'&&['Master Administrator','Maker'].includes(user.role)?`<button class="action secondary" onclick="cancelJournal(${x.id})">Batalkan</button>`:'-'}</td></tr>`).join('')}</tbody></table></div>`}catch(e){main.innerHTML='<div class="card">'+e.message+'</div>'}}
function journalForm(){main.innerHTML=`<div class="row"><h2>Buat Register Jurnal</h2><button class="action secondary" onclick="journals()">Kembali</button></div><div class="card"><div class="grid formgrid"><div class="field"><label>Tanggal Jurnal</label><input id="jd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Nama Biaya</label><input id="jc"></div><div class="field"><label>Nominal Biaya</label><input id="ja" type="number" min="0"></div><div class="field"><label>Penerima Biaya</label><input id="jp"></div></div><div class="notice">Nomor register dibuat oleh server setelah data disimpan.</div><button class="action" onclick="saveJournal()">Simpan & Terbitkan Nomor</button></div>`}
async function saveJournal(){try{if(!jc.value||!ja.value||!jp.value)return alert('Lengkapi seluruh data.');const d=await request('/journals',{method:'POST',body:JSON.stringify({journal_date:jd.value,cost_name:jc.value,amount:Number(ja.value),payee:jp.value})});alert('Register berhasil diterbitkan: '+d.journal_no);journals()}catch(e){alert(e.message)}}
async function cancelJournal(id){const reason=prompt('Alasan pembatalan (wajib):');if(!reason)return;try{await request('/journals/'+id+'/cancel',{method:'POST',body:JSON.stringify({reason})});journals()}catch(e){alert(e.message)}}
async function controlCards(){try{const rows=await request('/control-cards');main.innerHTML=`<div class="row"><div><div class="muted">KARTU KONTROL</div><h2>Daftar Kartu Kontrol</h2></div>${['Master Administrator','Maker'].includes(user.role)?'<button class="action" onclick="kkForm()">+ Buat Kartu Kontrol</button>':''}</div><div class="card"><table><thead><tr><th>Nomor</th><th>Pekerjaan</th><th>Vendor</th><th>User / Divisi</th><th>Nilai</th><th>Metode</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${x.card_no}</b></td><td>${x.job_name}</td><td>${x.vendor_name||'-'}</td><td>${x.user_name}<br><span class="muted">${x.division_name}</span></td><td>${rupiah(x.procurement_value)}</td><td>${x.payment_method==='TERMIN'?'Termin':'Monthly'}</td><td><span class="badge ${x.status==='MENUNGGU APPROVAL'?'warn':''}">${x.status}</span></td><td>${['DRAFT','DIKEMBALIKAN'].includes(x.status)&&['Master Administrator','Maker'].includes(user.role)?`<button class="action secondary" onclick="submitKK(${x.id})">Ajukan Approval</button>`:'-'}</td></tr>`).join('')}</tbody></table></div>`}catch(e){main.innerHTML='<div class="card">'+e.message+'</div>'}}
function kkForm(){main.innerHTML=`<div class="row"><h2>Buat Kartu Kontrol</h2><button class="action secondary" onclick="controlCards()">Kembali</button></div><div class="card"><div class="grid formgrid"><div class="field"><label>Nama Pekerjaan *</label><input id="kjob"></div><div class="field"><label>Nomor Kontrak</label><input id="kcontract"></div><div class="field"><label>Nama Vendor</label><input id="kvendor"></div><div class="field"><label>Nama PIC Vendor</label><input id="kpic"></div><div class="field"><label>Nomor PIC Vendor</label><input id="kphone"></div><div class="field"><label>Nama User * (diisi manual)</label><input id="kuser"></div><div class="field"><label>Nama Divisi * (diisi manual)</label><input id="kdiv"></div><div class="field"><label>Nilai Pengadaan *</label><input id="kvalue" type="number" min="0" oninput="renderTerms()"></div><div class="field"><label>Pajak</label><select id="ktax"><option>Termasuk Pajak</option><option>Belum Termasuk Pajak</option></select></div><div class="field"><label>Metode Pembayaran</label><select id="kmethod" onchange="paymentMode()"><option value="TERMIN">Pembayaran Bertahap / Termin</option><option value="MONTHLY">Pembayaran Rutin Bulanan (Monthly Payment)</option></select></div></div><div id="paycfg"></div><div class="notice">Nama User dan Nama Divisi diisi manual. Sistem tetap mencatat akun pembuat dan waktu pembuatan pada Audit Trail.</div><button class="action" onclick="saveKK()">Simpan Draft</button></div>`;paymentMode()}
function paymentMode(){if(kmethod.value==='TERMIN'){paycfg.innerHTML=`<div class="field" style="max-width:260px"><label>Jumlah Termin</label><input id="termcount" type="number" min="1" max="10" value="2" oninput="renderTerms()"></div><div id="terms"></div>`;renderTerms()}else paycfg.innerHTML=`<div class="grid formgrid"><div class="field"><label>Jangka Waktu Pembayaran</label><select id="dtype" onchange="document.querySelector('#months').classList.toggle('hidden',this.value!=='TERBATAS')"><option value="TERBATAS">Terbatas</option><option value="TIDAK TERBATAS">Tidak Terbatas</option></select></div><div class="field" id="months"><label>Jumlah Bulan</label><input id="dmonths" type="number" min="1" value="12"></div></div>`}
function renderTerms(){if(!document.querySelector('#terms'))return;const n=Math.max(1,Math.min(10,Number(termcount.value||1))),v=Number(kvalue.value||0);terms.innerHTML=Array.from({length:n},(_,i)=>`<div class="card" style="margin:10px 0;background:#f8fafc"><b>Termin ${i+1}</b><div class="grid formgrid"><div class="field"><label>Progress/Kondisi</label><input id="prog${i}"></div><div class="field"><label>Persentase Pembayaran (%)</label><input id="pct${i}" type="number" min="0" max="100" oninput="autoTerm(${i})"></div><div class="field"><label>Nilai Termin</label><input id="tv${i}" type="number" min="0"></div><div class="field"><label>Override Manual</label><select id="ov${i}" onchange="document.querySelector('#rs${i}').classList.toggle('hidden',this.value!=='1')"><option value="0">Tidak</option><option value="1">Ya</option></select></div><div class="field hidden" id="rs${i}"><label>Alasan Override</label><input id="reason${i}"></div></div></div>`).join('')}
function autoTerm(i){document.querySelector('#tv'+i).value=Math.round(Number(kvalue.value||0)*Number(document.querySelector('#pct'+i).value||0)/100)}
async function saveKK(){try{const b={job_name:kjob.value,contract_no:kcontract.value,vendor_name:kvendor.value,vendor_pic_name:kpic.value,vendor_pic_phone:kphone.value,user_name:kuser.value,division_name:kdiv.value,procurement_value:Number(kvalue.value),tax_status:ktax.value,payment_method:kmethod.value};if(b.payment_method==='TERMIN'){b.terms=Array.from({length:Number(termcount.value)},(_,i)=>({term_no:i+1,progress_condition:document.querySelector('#prog'+i).value,payment_percentage:Number(document.querySelector('#pct'+i).value),term_value:Number(document.querySelector('#tv'+i).value),manual_override:document.querySelector('#ov'+i).value==='1',override_reason:document.querySelector('#reason'+i)?.value||null}))}else{b.duration_type=dtype.value;b.duration_months=dtype.value==='TERBATAS'?Number(dmonths.value):null}const d=await request('/control-cards',{method:'POST',body:JSON.stringify(b)});alert('Draft Kartu Kontrol berhasil dibuat: '+d.card_no);controlCards()}catch(e){alert(e.message)}}
async function submitKK(id){if(!confirm('Ajukan Kartu Kontrol ini ke Approver?'))return;try{await request('/control-cards/'+id+'/submit',{method:'POST',body:'{}'});controlCards()}catch(e){alert(e.message)}}
async function approvals(){try{const rows=await request('/approvals/pending');main.innerHTML=`<div><div class="muted">APPROVAL</div><h2>Menunggu Approval</h2></div>${rows.length?rows.map(x=>`<div class="card" style="margin:12px 0"><div class="row"><div><b>${x.card_no}</b><h3 style="margin:5px 0">${x.job_name}</h3><div class="muted">${x.vendor_name||'-'} • ${x.user_name} / ${x.division_name}</div></div><div class="num" style="font-size:20px">${rupiah(x.procurement_value)}</div></div><p>Metode: <b>${x.payment_method==='TERMIN'?'Pembayaran Bertahap / Termin':'Pembayaran Rutin Bulanan'}</b></p><div class="row"><button class="action secondary" onclick="returnKK(${x.id})">KEMBALIKAN</button><button class="action" onclick="approveKK(${x.id})">APPROVE</button></div></div>`).join(''):'<div class="card">Tidak ada Kartu Kontrol yang menunggu approval.</div>'}`}catch(e){main.innerHTML='<div class="card">'+e.message+'</div>'}}
async function approveKK(id){if(!confirm('Setujui Kartu Kontrol ini?'))return;try{await request('/control-cards/'+id+'/decision',{method:'POST',body:JSON.stringify({decision:'APPROVE'})});approvals()}catch(e){alert(e.message)}}
async function returnKK(id){const reason=prompt('Alasan pengembalian (wajib):');if(!reason)return;try{await request('/control-cards/'+id+'/decision',{method:'POST',body:JSON.stringify({decision:'RETURN',reason})});approvals()}catch(e){alert(e.message)}}

function rupiah(n){return 'Rp'+new Intl.NumberFormat('id-ID').format(Number(n))}
if(token&&user)showApp();
</script></body></html>
